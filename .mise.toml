[tools]
zig = "0.16.0"

[env]
_.file = ".env"

[tasks.test]
description = "Run tests"
run = "zig build test"

[tasks.examples]
description = "Build examples"
run = "zig build examples"

[tasks.openrouter]
description = "Run basic OpenRouter example"
run = "zig build run-openrouter"

[tasks.planner]
description = "Run tool planner example"
run = "zig build run-tool-planner"

[tasks.citations]
description = "Run exact citations example"
run = "zig build run-exact-citations"

[tasks.actions]
description = "Run action items example"
run = "zig build run-action-items"

[tasks.agent]
description = "Run tagged-union agent example"
run = "zig build run-agent"

[tasks.tool-call]
description = "Run native tool-call example"
run = "zig build run-native-tool-call"

[tasks.multimodal]
description = "Run multimodal inspection example"
run = "zig build run-multimodal-inspection"

[tasks.router]
description = "Run support router example"
run = "zig build run-support-router"

[tasks.invoice]
description = "Run invoice extraction example"
run = "zig build run-invoice-extraction"

[tasks.judge]
description = "Run LLM judge example"
run = "zig build run-llm-judge"

[tasks.redact]
description = "Run PII redaction example"
run = "zig build run-pii-redaction"

[tasks.query]
description = "Run query understanding example"
run = "zig build run-query-understanding"

[tasks.batch]
description = "Run batch extraction example"
run = "zig build run-batch-extract"

[tasks.responses-tool]
description = "Run Responses tool-call example"
run = "zig build run-responses-tool-call"

[tasks.classify]
description = "Run tagged-union classifier example"
run = "zig build run-classify-union"
